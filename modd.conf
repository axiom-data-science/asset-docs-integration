
# API / web components
asset_docs_integration/**/*.py .env modd.conf {
    daemon +sigterm: asset_docs_pgsql_to_buoy_retriever \
        --pipeline-slug 'dummy_pipeline' \
        --dataset-slug 'dummy_dataset' \
        --config-slug 'dummy_dataset_testing' \
        --buoy-retriever-url \
        "${BR_BASE_URL:-http://localhost:12345/backend/}"
}
